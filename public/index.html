<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5fb838">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Лавочка">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Лавочка</title>
<style>
@font-face{font-family:Nunito;font-weight:900;font-display:block;src:url(vendor/nunito-cyrillic-900-normal.woff2) format('woff2');unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Nunito;font-weight:900;font-display:block;src:url(vendor/nunito-latin-900-normal.woff2) format('woff2')}
html,body{margin:0;height:100%;overflow:hidden;background:#7ccd49;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:Nunito,system-ui,sans-serif}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
.screen{position:fixed;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;background:rgba(25,45,20,.42);padding:16px;box-sizing:border-box;touch-action:auto}
.screen[hidden]{display:none}
.card{background:#fffaf0;border-radius:26px;padding:22px 20px 18px;width:100%;max-width:360px;max-height:100%;overflow:auto;box-sizing:border-box;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.3);color:#3b3a36;-webkit-overflow-scrolling:touch}
.card h1{margin:0;font-size:34px;color:#e0393f;letter-spacing:.5px}
.card h2{margin:0;font-size:15px;color:#8a8576;text-transform:uppercase;letter-spacing:1px}
.card h3{margin:2px 0 12px;font-size:24px;color:#2f6b28}
.row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:16px;padding:13px 22px;background:#4cbb45;color:#fff;font:900 18px Nunito,system-ui;box-shadow:0 4px 0 #2f8c2c;cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #2f8c2c}
.btn.alt{background:#f2ead6;color:#5d5747;box-shadow:0 4px 0 #d8ccad}
.btn.small{padding:8px 12px;font-size:15px;border-radius:12px;min-width:74px}
.btn:disabled{opacity:.45}
.btn.wide{width:100%;margin-top:10px}
.cash{display:inline-flex;align-items:center;gap:5px}.cash svg{width:24px;height:24px}
.btn .cash svg{width:20px;height:20px}
.bankrow{display:flex;justify-content:center;gap:18px;margin:10px 0 14px;font-size:20px}
.bankrow span{display:inline-flex;align-items:center;gap:4px}.bankrow svg{width:24px;height:24px}
#upList{list-style:none;padding:0;margin:6px 0 10px;text-align:left}
#upList li{display:flex;align-items:center;gap:10px;background:#f2ead6;border-radius:14px;padding:10px 12px;margin:7px 0}
.u-text{flex:1;display:flex;flex-direction:column;gap:2px}.u-text b{font-size:17px}.u-text span{font-size:14px;color:#6d675a}
.pips{display:flex;gap:4px;margin-top:3px}.pips i{width:16px;height:6px;border-radius:3px;background:#d8ccad}.pips i.on{background:#4cbb45}
#pauseBtn{position:fixed;top:calc(14px + env(safe-area-inset-top));right:12px;z-index:2;width:46px;height:46px;border:0;border-radius:23px;background:rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;touch-action:manipulation}
#pauseBtn[hidden]{display:none}
#pauseBtn i{width:6px;height:18px;border-radius:2px;background:#fff}

.gfx{margin-top:14px;font-size:15px;color:#6d675a;display:flex;align-items:center;justify-content:center;gap:8px}.gfx .btn.on{background:#4cbb45;color:#fff;box-shadow:0 3px 0 #2f8c2c}
.ic{width:30px;height:30px;vertical-align:middle;flex:none}.ic.s{width:18px;height:18px}.ic.big{width:46px;height:46px}
.cash{display:inline-flex;align-items:center;gap:3px}
.screen.sheet{align-items:flex-end;background:rgba(25,45,20,.18)}
.sheet .card{max-height:72%;border-radius:26px 26px 18px 18px}
.list{list-style:none;padding:0;margin:6px 0 10px;text-align:left}
.list li{display:flex;align-items:center;gap:10px;background:#f2ead6;border-radius:14px;padding:8px 10px;margin:6px 0}
.list li .u-text{flex:1;display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;gap:2px 8px}.list li .u-text b{font-size:16px}.list li .u-text span{flex-basis:100%;font-size:13px;color:#6d675a;margin-left:38px}
.list li.grid{display:flex;flex-wrap:wrap;gap:8px}.list li.grid span{display:flex;align-items:center;gap:2px;background:#fffaf0;border-radius:10px;padding:2px 8px 2px 2px}
.need{font-style:normal;white-space:nowrap}.need.miss{color:#d0442f}
#shopTabs{margin-bottom:6px}#shopTabs .on{background:#4cbb45;color:#fff;box-shadow:0 3px 0 #2f8c2c}
#shopList{list-style:none;padding:0;margin:6px 0 10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shopItem{background:#f2ead6;border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.shopItem b{font-size:14px}.shopItem span{font-size:11px;color:#8a8576;min-height:13px}.shopItem .price{font-size:14px}
.shopItem.locked{opacity:.5}.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#buildBtn{position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:2;border:0;border-radius:22px;background:#4cbb45;box-shadow:0 4px 0 #2f8c2c;color:#fff;font:900 16px Nunito,system-ui;display:flex;align-items:center;gap:6px;padding:10px 16px 10px 12px;cursor:pointer;touch-action:manipulation}
#buildBtn[hidden],#placeBar[hidden],#seedBar[hidden]{display:none}
#buildBtn svg{width:24px;height:24px}
#placeBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));z-index:2;display:flex;align-items:center;gap:12px;background:rgba(25,30,45,.65);border-radius:26px;padding:8px;color:#fff;font:900 14px Nunito,system-ui}
#placeBar .btn{padding:10px 18px;font-size:20px}
#seedBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:2;display:flex;gap:8px;background:rgba(25,30,45,.55);border-radius:20px;padding:8px}
.seed{border:0;border-radius:14px;background:#fffaf0;padding:4px 6px;display:flex;flex-direction:column;align-items:center;font:900 11px Nunito,system-ui;color:#5d5747;touch-action:manipulation;cursor:pointer}
.seed.on{background:#c9f2b5;box-shadow:0 0 0 3px #4cbb45}.seed:disabled{opacity:.4}
#levelList{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:8px 0 14px}#levelList span{display:flex;flex-direction:column;align-items:center;font-size:13px;width:84px}
.stats{font-size:15px;color:#6d675a;margin:8px 0 14px;line-height:1.4}.stats b{color:#2f6b28}
#pauseFps{font-size:12px;color:#a19b8a;margin-top:10px}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<button id="pauseBtn" hidden aria-label="Пауза"><i></i><i></i></button>
<button id="buildBtn" hidden aria-label="Стройка"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9H3z" fill="#fff"/><rect x="9.5" y="13" width="5" height="7" fill="#4cbb45"/></svg><span>Стройка</span></button>
<div id="placeBar" hidden><button id="placeNo" class="btn alt">✕</button><span>Двигай пальцем</span><button id="placeOk" class="btn">✓</button></div>
<div id="seedBar" hidden></div>
<div id="pause" class="screen" hidden><div class="card">
  <h1 style="font-size:30px">Лавочка</h1>
  <div id="pauseStats" class="stats"></div>
  <button id="pauseResume" class="btn wide">Играть</button>
  <div class="gfx">Графика: <button id="gfxLite" class="btn small alt">Быстрая</button><button id="gfxFull" class="btn small alt">Красивая</button></div>
  <button id="pauseReset" class="btn alt small" style="margin-top:16px">Начать ферму заново</button>
  <div id="pauseFps"></div>
</div></div>
<div id="card" class="screen sheet" hidden><div class="card">
  <h1 id="cardTitle" style="font-size:26px"></h1>
  <div id="cardSub" class="stats"></div>
  <ul id="cardList" class="list"></ul>
  <div class="row"><button id="cardMove" class="btn alt small">Переставить</button><button id="cardSell" class="btn alt small">Убрать</button><button id="cardClose" class="btn small">Готово</button></div>
</div></div>
<div id="shop" class="screen sheet" hidden><div class="card">
  <h1 style="font-size:26px">Стройка</h1>
  <div class="bankrow"><span id="shopBank"></span></div>
  <div id="shopTabs" class="row"><button class="btn small alt" data-tab="farm">Ферма</button><button class="btn small alt" data-tab="factory">Фабрики</button><button class="btn small alt" data-tab="decor">Украшения</button></div>
  <ul id="shopList"></ul>
  <button id="shopClose" class="btn wide">Закрыть</button>
</div></div>
<div id="levelup" class="screen" hidden><div class="card">
  <h1 id="levelNum"></h1>
  <div class="stats">Теперь можно:</div>
  <div id="levelList"></div>
  <button id="levelOk" class="btn wide">Ура!</button>
</div></div>
<div id="away" class="screen" hidden><div class="card">
  <h3>С возвращением!</h3>
  <p id="awayText" class="stats"></p>
  <button id="awayOk" class="btn wide">Играть</button>
</div></div>
<div id="reset" class="screen" hidden><div class="card">
  <h3>Начать заново?</h3>
  <p class="stats">Все постройки, улучшения и монеты пропадут. Отменить это нельзя.</p>
  <div class="row"><button id="resetNo" class="btn">Нет, играть дальше</button><button id="resetYes" class="btn alt small">Да, с нуля</button></div>
</div></div>
<div id="loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:900 22px Nunito,system-ui;color:#fff;text-shadow:0 2px 0 #2f6b28">Загрузка…</div>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<script src="game.js"></script>
<script src="ui.js"></script>
<script type="module" src="view.js"></script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
