<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5fb838">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Лавочка</title>
<style>
@font-face{font-family:Nunito;font-weight:900;font-display:block;src:url(vendor/nunito-cyrillic-900-normal.woff2) format('woff2');unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Nunito;font-weight:900;font-display:block;src:url(vendor/nunito-latin-900-normal.woff2) format('woff2')}
html,body{margin:0;height:100%;overflow:hidden;background:#7ccd49;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:Nunito,system-ui,sans-serif}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#reset{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:2;border:0;border-radius:14px;padding:6px 10px;background:rgba(0,0,0,.2);color:#fff;font:900 13px Nunito,system-ui}
#win{position:fixed;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;background:rgba(30,40,20,.45)}
#win[hidden]{display:none}
#win div{background:#fffaf0;border-radius:24px;padding:26px 28px;text-align:center;max-width:300px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#win h1{margin:0 0 8px;font-size:28px;color:#d63a42}
#win b{white-space:nowrap}
#win p{margin:6px 0;color:#444;font-size:16px;line-height:1.4;font-weight:900}
#win button{margin-top:14px;border:0;border-radius:16px;padding:12px 24px;background:#4cbb45;color:#fff;font:900 18px Nunito,system-ui;box-shadow:0 4px 0 #2f8c2c}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<button id="reset">заново</button>
<div id="win" hidden><div>
  <h1>Ярмарка открыта!</h1>
  <p>Деревня отстроена за <b id="wtime"></b>.</p>
  <p>Покупателей теперь больше, а платят они щедрее. Можно играть дальше.</p>
  <button id="wok">Дальше</button>
</div></div>
<div id="loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:900 22px Nunito,system-ui;color:#fff;text-shadow:0 2px 0 #2f6b28">Загрузка…</div>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<script src="game.js"></script>
<script type="module" src="view.js"></script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
